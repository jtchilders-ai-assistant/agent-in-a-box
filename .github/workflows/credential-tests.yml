name: Task 3 credential security

on:
  pull_request:
  push:
    branches: [main]

jobs:
  credential-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.11']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install PyYAML
      - name: Run credential security tests
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: >-
          python -W error -W error::ResourceWarning -m unittest discover
          -s tests -p 'test_agent_box_credentials*.py' -v
