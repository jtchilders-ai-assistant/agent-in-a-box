# ALCF Agent — Hermes config template
#
# Rendered into the live config at container start by scripts/entrypoint.sh,
# which substitutes ${...} placeholders from environment variables and injects
# the freshly-minted Globus access token as the api_key.
#
# IMPORTANT: keep this MINIMAL. Do not add personal fallback providers, stray
# base_urls, or secrets. The packaged agent must have exactly ONE inference
# target so it never silently talks to the wrong host.

# Hermes config schema version this template is written for. Hermes treats a
# config without this stamp as version 0 -- below its migration support floor
# (12) -- and logs "config migration skipped ... run `hermes setup`" on every
# boot. The entrypoint re-renders config.yaml from this template on every
# start, so the file is always in the base image's current schema; stamp it
# with that version (DEFAULT_CONFIG["_config_version"] in
# hermes_cli/config_defaults.py: 53 for Hermes v0.23.2). Bump it together with
# HERMES_BASE in the Dockerfile, after re-checking the template against the new
# schema.
_config_version: 53

model:
  # The ALCF Inference Service is OpenAI-compatible. provider: custom tells
  # Hermes to treat base_url as a raw OpenAI-wire endpoint.
  #
  # provider is set by the entrypoint to the ONE named provider in the
  # generated `providers:` block that lists the launch model on this endpoint
  # (default: custom:alcf-tara-reasoning); it refuses to start if there is none or
  # more than one. The launch turn then gets that provider's output cap (its
  # extra_body.max_tokens), the same cap a later /model switch to the model
  # gets. We deliberately DO NOT set model.max_tokens here (see below).
  provider: "${ALCF_LAUNCH_PROVIDER}"
  base_url: "${ALCF_BASE_URL}"        # default https://inference-api.alcf.anl.gov/resource_server/tara/api/v1
  api_key: "${ALCF_ACCESS_TOKEN}"     # Globus access token, injected + refreshed by entrypoint
  model: "${ALCF_MODEL}"              # default muse-spark-bf16 (Tara)
  default: "${ALCF_MODEL}"

  # NOTE: model.max_tokens is intentionally NOT set here.
  #
  # Reasoning models (gpt-oss-*, gemma-4-*, nemotron-3-super, *-Thinking) emit a
  # hidden reasoning channel that DRAWS FROM THE SAME output budget as the visible
  # answer; too small a cap yields empty content (finish_reason=length). They need
  # more headroom than plain chat models — i.e. a PER-MODEL cap.
  #
  # Hermes has no per-model max_tokens (unlike context_length), and Hermes
  # v0.23.2 IGNORES a provider-level max_tokens on a `providers:` entry (it logs
  # "unknown config keys ignored: max_tokens"). It DOES send a provider's
  # `extra_body` with every request to a model selected under that provider
  # (as request overrides, at launch and after a /model switch), and the
  # OpenAI-compatible wire carries extra_body.max_tokens as the request's
  # max_tokens. So populate_models.py splits each cluster into a baseline
  # provider (2048) and a "-reasoning" provider (12288), each with its own
  # extra_body.max_tokens. model.max_tokens stays unset so that per-provider cap
  # is the only output cap in play. Both caps are env-tunable:
  # ALCF_MAX_TOKENS / ALCF_REASONING_MAX_TOKENS.

  # The REAL serving context window for this model, in tokens (prompt+completion
  # combined). ALCF caps some models below their published spec (e.g. Sophia
  # serves gemma-4-31B-it at 128000, not the 256000 Hermes assumes from the model
  # family). Hermes' hardcoded family table would otherwise over-estimate the
  # window, so its footer/auto-compression fire too late and a request that
  # overflows the real window makes the gateway silently drop the SSE stream
  # (surfaced as EmptyStreamError). Setting model.context_length is the highest-
  # priority override in Hermes, so this makes the footer + compression accurate.
  # entrypoint.sh resolves this from the server's max_model_len at start (falling
  # back to ALCF_CONTEXT_LENGTH / 128000 if the lookup fails).
  context_length: ${ALCF_CONTEXT_LENGTH}

agent:
  # Trim toolsets that make no sense in this packaged, single-user context.
  disabled_toolsets:
    - computer_use
    - image_gen
    - video_gen
    - tts
    - spotify
    - x_search
    - yuanbao

memory:
  # Built-in on-disk memory (MEMORY.md/USER.md), persisted via the /opt/data
  # volume, is always active — no external provider needed. (Do NOT set
  # provider: mnemosyne here; that backend is not in the base image.)
  provider: none

display:
  # Web dashboard is the primary surface; the CLI/TUI still work if exec'd in.
  interface: cli

terminal:
  # Default per-command timeout for the agent's terminal tool. Stock Hermes is
  # 180s, which killed every alcf_remote_bash.py call that hit a PBS queue wait
  # or a real build (the helper waits --timeout, default 1200s, for the remote
  # result). 1320 = helper default + 2 min submission overhead, so a CLI
  # remote-bash call is never killed before the helper itself gives up. Callers
  # can still pass a smaller per-call timeout for quick local commands; the
  # ceiling for larger values is TERMINAL_MAX_FOREGROUND_TIMEOUT (Dockerfile,
  # 1800). Commands that finish early return immediately regardless.
  timeout: 1320

# Dashboard auth. A containerized dashboard reachable via `docker run -p` must
# bind 0.0.0.0, and Hermes (correctly) refuses a non-loopback bind without an
# auth gate. The entrypoint fills these from ALCF_DASHBOARD_USER /
# ALCF_DASHBOARD_PASSWORD (it hashes the password at start; the plaintext is
# never written to disk). Placeholders left as-is if unset.
dashboard:
  basic_auth:
    username: "${ALCF_DASHBOARD_USER}"
    password_hash: "${ALCF_DASHBOARD_PASSWORD_HASH}"

# Curated switchable models — GENERATED AT CONTAINER START by
# scripts/populate_models.py, which queries the ALCF-specific
# `.../<cluster>/models` endpoint on every serving cluster (the gateway 404s the
# standard OpenAI `/v1/models` path, so Hermes' own live discovery can't work)
# and emits keyed `providers` entries per cluster:
#
#   - alcf-sophia   (vLLM,   full OpenAI-compat)   .../sophia/vllm/v1
#   - alcf-metis    (SambaNova, chat-only)         .../metis/api/v1
#   - alcf-minerva  (api framework)                .../minerva/api/v1
#   - alcf-tara     (api framework)                .../tara/api/v1
#
# Tara serves the default launch model (muse-spark-bf16). Tara models are not
# kept always hot, so a first request may wait for a cold start.
#
# It filters the catalog to CHAT models (dropping embeddings, vision, and science
# models like GenSLM/dinov3/sam3) and gives each its REAL serving context window.
# This matters because the gateway serves different models — even the SAME-NAMED
# model on different clusters — at very different windows (Sophia gemma-4-31B-it
# =128000 vs Metis gemma-4-31B-it=131072; Metis Mistral-Large-3=8192). Hermes
# honours per-model `providers.<key>.models.<id>.context_length` overrides on
# an in-session `/model` switch; without the correct window a switch overflows
# the real context and the gateway silently drops the SSE stream
# (EmptyStreamError). The providers appear separately in the dropdown so
# same-named models across clusters don't collide.
#
# gpt-oss-* are REASONING models (hidden reasoning consumes max_tokens); the
# non-reasoning models (llama/gemma/mistral/nemotron) feel snappier for plain
# chat. Cold models can take 10-15 min to load on first request.
#
# HOW THE REPLACEMENT WORKS: entrypoint.sh replaces everything from the sentinel
# line below (inclusive) to end-of-file with the generated block. The static
# `providers:` here is a committed FALLBACK that (a) keeps this template
# valid YAML and (b) is used only if the sentinel replacement is skipped
# entirely. populate_models.py ALSO emits its own static fallback on any
# discovery failure, so the live config always has a valid, useful block.
#__ALCF_PROVIDERS__  (entrypoint replaces from this line to EOF)
providers:
  # NOTE: each cluster is split into a baseline provider (plain chat models,
  # extra_body.max_tokens 2048) and a "-reasoning" provider (reasoning models,
  # extra_body.max_tokens 12288). Reasoning models emit a hidden chain-of-thought
  # that shares the output budget, so they need a larger cap. The cap lives in
  # extra_body because Hermes v0.23.2 ignores a provider-level max_tokens.
  # populate_models.py regenerates this at container start from the live catalog
  # (detecting reasoning via the /models reasoning_parser field + an id
  # heuristic); this static block is only a fallback if generation is skipped
  # entirely.
  alcf-sophia:
    name: alcf-sophia
    api: "https://inference-api.alcf.anl.gov/resource_server/sophia/vllm/v1"
    api_key: "${ALCF_ACCESS_TOKEN}"
    discover_models: false
    extra_body:
      max_tokens: 2048
    # NOTE: only models whose REAL ALCF serving window is >= 64000 tokens are
    # listed. Hermes refuses to load any model below its 64k MINIMUM_CONTEXT_LENGTH
    # floor, so a sub-floor model would be a broken dropdown entry. ALCF caps many
    # models (all Llama 3.x/4, Mixtral, Devstral, Mistral-Large-2407) at 16k-32k,
    # so they are intentionally absent here and from the generated live list.
    models:
      argonne/AuroraGPT-IT-v4-0125:
        context_length: 128000
  alcf-sophia-reasoning:
    name: alcf-sophia-reasoning
    api: "https://inference-api.alcf.anl.gov/resource_server/sophia/vllm/v1"
    api_key: "${ALCF_ACCESS_TOKEN}"
    discover_models: false
    extra_body:
      max_tokens: 12288
    models:
      arcee-ai/Trinity-Large-Thinking-W4A16:
        context_length: 131072
      google/gemma-4-26B-A4B-it:
        context_length: 262144
      google/gemma-4-31B-it:
        context_length: 128000
      nvidia/nemotron-3-super-120b:
        context_length: 262144
      openai/gpt-oss-120b:
        context_length: 65536
      openai/gpt-oss-20b:
        context_length: 128000
  alcf-metis-reasoning:
    name: alcf-metis-reasoning
    api: "https://inference-api.alcf.anl.gov/resource_server/metis/api/v1"
    api_key: "${ALCF_ACCESS_TOKEN}"
    discover_models: false
    extra_body:
      max_tokens: 12288
    # Metis reports no server window; values are empirically verified. Only >=64k
    # models are listed — Mistral-Large-3 (Metis) serves at just 8192 and is
    # excluded (Hermes would reject it). Both current Metis models (gemma-4, gpt-oss)
    # are reasoning models, so there is no baseline alcf-metis block in the fallback.
    models:
      gemma-4-31B-it:
        context_length: 131072
      gpt-oss-120b:
        context_length: 131072
  alcf-minerva-reasoning:
    name: alcf-minerva-reasoning
    api: "https://inference-api.alcf.anl.gov/resource_server/minerva/api/v1"
    api_key: "${ALCF_ACCESS_TOKEN}"
    discover_models: false
    extra_body:
      max_tokens: 12288
    # Minerva publishes a structured `capabilities` object, so these windows and
    # the reasoning class are read straight from the catalog rather than guessed
    # (verified live 2026-08-24). All three advertise reasoning.supported=true —
    # note inkling-bf16 and nemotron-3-ultra match no reasoning ID heuristic, so
    # the capabilities read is what keeps them out of the 2048-token baseline
    # (starved of budget they return empty content).
    models:
      gpt-oss-120b:
        context_length: 131072
      inkling-bf16:
        context_length: 262144
      nemotron-3-ultra:
        context_length: 262144
  alcf-tara-reasoning:
    name: alcf-tara-reasoning
    api: "https://inference-api.alcf.anl.gov/resource_server/tara/api/v1"
    api_key: "${ALCF_ACCESS_TOKEN}"
    discover_models: false
    extra_body:
      max_tokens: 12288
    # From the Tara table of the ALCF models doc (2026-11-23): every model is
    # marked reasoning, so there is no baseline alcf-tara block. None is marked
    # always hot; a first request may wait for a cold start.
    models:
      beam-1.0-fp8:
        context_length: 1048576
      google/gemma-4-31B-it-262k:
        context_length: 262144
      inkling-bf16:
        context_length: 1048576
      mistral-large-4:
        context_length: 1048576
      muse-spark-bf16:
        context_length: 1048576
      nemotron-3-ultra:
        context_length: 1048576
      nemotron-35-super-vl:
        context_length: 1048576
      openai/gpt-oss-120b:
        context_length: 131072
      openai/gpt-oss-20b:
        context_length: 65536
