alcf:
  iri:
    default_version: v1
    versions:
      v1:
        base_url: https://api.alcf.anl.gov/api/v1
        auth_provider: alcf-tokens

nersc:
  iri:
    default_version: v2
    versions:
      v1:
        base_url: https://api.iri.nersc.gov/api/v1
        auth_provider: nersc-tokens
      v2:
        base_url: https://api.iri.nersc.gov/api/v2
        auth_provider: nersc-tokens

esnet-east:
