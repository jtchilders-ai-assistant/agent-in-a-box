      v1:
        base_url: https://iri-dev.ppg.es.net/api/v1
        auth_provider: amsc-pat
      v2:
        base_url: https://iri-dev.ppg.es.net/api/v2
        auth_provider: amsc-pat

esnet-west:
  iri:
    default_version: v2
    versions:
      v1:
        base_url: https://esnet-west.sdn-sense.net/api/v1
        auth_provider: amsc-pat
      v2:
        base_url: https://esnet-west.sdn-sense.net/api/v2
        auth_provider: amsc-pat
